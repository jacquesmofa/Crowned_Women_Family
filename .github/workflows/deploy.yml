# CWFCS — Build the React site and upload it to HostGator on every push to main
name: Automated HostGator Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Build React App
        run: |
          npm install
          npm run build

      # The Vite build writes the finished website to ./out
      # (see build.outDir in vite.config.ts), so we upload exactly that folder.
      - name: Deploy static files to HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: "${{ secrets.FTP_SERVER }}"
          username: "${{ secrets.FTP_USERNAME }}"
          password: "${{ secrets.FTP_PASSWORD }}"
          local-dir: ./out/
          server-dir: /crowned.org/
          # If HostGator rejects the plain FTP login, enable FTPS instead:
          # protocol: ftps