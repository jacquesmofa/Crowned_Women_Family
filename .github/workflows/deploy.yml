# CWFCS — Build the React site and upload it to HostGator on every push to main.
# Needs 3 repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    HostGator FTP host only, no "ftp://" and no slash, e.g. ftp.yourdomain.org
#                 or the server IP shown in cPanel > "FTP Accounts" > Configure FTP Client
#   FTP_USERNAME  the full FTP user, e.g. deploy@yourdomain.org (or the cPanel username)
#   FTP_PASSWORD  that account's password
# Optional repository VARIABLE (same page, "Variables" tab):
#   FTP_SERVER_DIR  folder on the server, ending with "/". Default "/crowned.org/".
#                   If the FTP account was created pointing straight at the site folder, use "./"
name: Automated HostGator Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

concurrency:
  group: hostgator-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and Build React App
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The Vite build writes the finished website to ./out (build.outDir in vite.config.ts).
      - name: Deploy static files to HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/crowned.org/' }}
          timeout: 120000
          # Source maps are for debugging only; keep them off the live server.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map
